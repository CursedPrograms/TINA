<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TINA</title>
  <style>
    :root {
      /* colour_scheme.xml (applied over these once loaded) */
      --bg: #0A0B0D; --panel: #121418; --border: #2A2E35; --divider: #1A1D22;
      --text: #ECEAE6; --text-sec: #A5A29C; --text-dim: #66655F;
      --accent: #F2A33A; --accent2: #3FA7D6; --ok: #7FC8A9; --warn: #FFBE50; --problem: #FF6B4A;
      --font: 'Cascadia Code', Consolas, 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    header img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; display: none; }
    header h1 { color: var(--accent); font-size: 1.4rem; letter-spacing: .15em; }
    header .sub { color: var(--text-sec); font-size: .8rem; }
    header .state { margin-left: auto; font-size: .8rem; color: var(--text-dim); }
    main { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 18px 16px 120px; }
    .task { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .task > .head { padding: 10px 14px; border-bottom: 1px solid var(--divider); display: flex; gap: 10px; align-items: baseline; }
    .task > .head b { color: var(--text); font-weight: normal; flex: 1; }
    .task > .head .st { font-size: .75rem; color: var(--text-dim); }
    .ev { padding: 6px 14px; font-size: .85rem; border-bottom: 1px solid var(--divider); white-space: pre-wrap; word-break: break-word; }
    .ev:last-child { border-bottom: none; }
    .ev.think { color: var(--text-dim); font-style: italic; }
    .ev.say { color: var(--text); }
    .ev.tool { color: var(--accent2); }
    .ev.result { color: var(--text-sec); max-height: 160px; overflow: auto; font-size: .78rem; }
    .ev.memory { color: var(--ok); font-size: .8rem; }
    .ev.error { color: var(--problem); }
    .ev.answer { color: var(--text); background: rgba(242,163,58,.07); border-left: 3px solid var(--accent); font-size: .95rem; padding: 10px 14px; }
    .ask { padding: 12px 14px; background: rgba(255,190,80,.08); border-top: 1px solid var(--warn); }
    .ask p { color: var(--warn); margin-bottom: 8px; white-space: pre-wrap; }
    button { font-family: var(--font); background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.yes { border-color: var(--ok); color: var(--ok); }
    button.no { border-color: var(--problem); color: var(--problem); }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 12px 16px; }
    footer form { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; height: 54px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--font); font-size: .9rem; }
    textarea:focus { outline: none; border-color: var(--accent); }
    .empty { color: var(--text-dim); padding: 30px 0; text-align: center; line-height: 1.8; }
  </style>
</head>
<body>
  <header>
    <img id="face" src="/avatar.jpg" alt="TINA" onload="this.style.display='block'">
    <div><h1>TINA</h1><div class="sub">Task Automation &amp; Research Assistant &middot; {{ model }}</div></div>
    <div class="state" id="state">...</div>
  </header>
  <main id="tasks">
    <div class="empty" id="empty">Give TINA a job: fix a compile error, find where something lives,<br>update a README, check on the fleet. She shows every step, and asks before anything risky.</div>
  </main>
  <footer>
    <form id="f"><textarea id="t" placeholder="What should TINA do? (Enter to send, Shift+Enter for a new line)"></textarea><button>SEND</button></form>
  </footer>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const box = document.getElementById('tasks');

    fetch('/colour_scheme.xml').then(r => r.ok ? r.text() : '').then(x => {
      const map = {background:'--bg', panel:'--panel', border:'--border', divider:'--divider', text:'--text', text_sec:'--text-sec',
                   text_dim:'--text-dim', accent:'--accent', accent2:'--accent2', ok:'--ok', warn:'--warn', problem:'--problem'};
      for (const m of x.matchAll(/name="([^"]+)"\s+value="(#[0-9A-Fa-f]{6})"/g)) if (map[m[1]]) document.documentElement.style.setProperty(map[m[1]], m[2]);
    }).catch(() => {});

    function render(ev) {
      const d = ev.data;
      switch (ev.kind) {
        case 'think': return `<div class="ev think">${esc(d)}</div>`;
        case 'say': return `<div class="ev say">${esc(d)}</div>`;
        case 'tool': return `<div class="ev tool">&rarr; ${esc(d.name)}(${esc(Object.entries(d.args).map(([k, v]) => k + '=' + JSON.stringify(v).slice(0, 80)).join(', '))})</div>`;
        case 'result': return `<div class="ev result">${esc(d.text)}</div>`;
        case 'memory': return `<div class="ev memory">remembers: ${d.map(esc).join(' &middot; ')}</div>`;
        case 'ask': return `<div class="ev tool">asked: ${esc(d)}</div>`;
        case 'answered': return `<div class="ev memory">you said ${esc(d)}</div>`;
        case 'error': return `<div class="ev error">${esc(d)}</div>`;
        case 'answer': return `<div class="ev answer">${esc(d)}</div>`;
      }
      return '';
    }

    function start(text) {
      document.getElementById('empty')?.remove();
      fetch('/task', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({task: text})})
        .then(r => r.json()).then(({id}) => {
          const el = document.createElement('section');
          el.className = 'task';
          el.innerHTML = `<div class="head"><b>${esc(text)}</b><span class="st">working...</span><button onclick="stopTask('${id}')">STOP</button></div><div class="evs"></div><div class="ask" style="display:none"></div>`;
          box.prepend(el);
          poll(id, el, 0);
        });
    }

    function poll(id, el, since) {
      fetch(`/task/${id}?since=${since}`).then(r => r.json()).then(d => {
        el.querySelector('.evs').insertAdjacentHTML('beforeend', d.events.map(render).join(''));
        const ask = el.querySelector('.ask');
        if (d.question) {
          ask.style.display = '';
          ask.innerHTML = `<p>${esc(d.question)}</p><button class="yes" onclick="reply('${id}', true)">ALLOW</button> <button class="no" onclick="reply('${id}', false)">DENY</button>`;
        } else ask.style.display = 'none';
        el.querySelector('.st').textContent = d.status === 'running' ? 'working...' : d.status + (d.result ? ` · ${d.result.steps} steps · ${d.result.seconds}s` : '');
        if (d.status === 'running') setTimeout(() => poll(id, el, d.next), 800);
        else el.querySelector('.head button').remove();
      }).catch(() => setTimeout(() => poll(id, el, since), 2000));
    }

    function reply(id, yes) { fetch(`/task/${id}/answer`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({yes})}); }
    function stopTask(id) { fetch(`/task/${id}/stop`, {method: 'POST'}); }

    const t = document.getElementById('t');
    document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); if (t.value.trim()) { start(t.value.trim()); t.value = ''; } });
    t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });

    function state() {
      fetch('/status').then(r => r.json()).then(s => {
        document.getElementById('state').textContent =
          `${s.model_ready ? 'model ready' : 'model missing'} · memory ${s.memory.reachable ? 'on' : 'offline'}${s.memory.pending ? ` (${s.memory.pending} waiting)` : ''}${s.busy ? ' · busy' : ''}`;
      }).catch(() => {});
    }
    state(); setInterval(state, 10000);
  </script>
</body>
</html>
