<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TINA</title>
  <link rel="stylesheet" href="/static/tina.css?v={{ ver }}">
  <script src="/static/tina.js?v={{ ver }}" defer></script>
</head>
<body>
  <header>
    <img id="face" src="/avatar.jpg" alt="TINA" onload="this.style.display='block'">
    <div><h1>TINA</h1><div class="sub">Task Intelligence &amp; Network Assistant &middot; {{ model }}</div></div>
    <div class="state" id="state">...</div>
    <label class="switch" title="Show or hide her reasoning (it's never spoken)"><input type="checkbox" id="showThink" checked><span></span>reasoning</label>
    <button type="button" id="newConvo" title="She remembers your last few tasks, so you can ask a follow-up (&quot;and the other one?&quot;). This forgets them: the next task starts fresh.">NEW CONVERSATION</button>
  </header>
  <main id="tasks">
    <div class="empty" id="empty">Give TINA a job: fix a compile error, find where something lives,<br>update a README, check on the fleet. She shows every step, and asks before anything risky.</div>
  </main>
  <footer>
    <div class="voicebar" id="voicebar" hidden>
      <span class="vstate off" id="vstate">MIC OFF</span>
      <span class="meter" title="what the mic hears"><span id="level"></span></span>
      <span class="heard" id="heard"></span>
    </div>
    <form id="f"><textarea id="t" placeholder="What should TINA do? (Enter to send, Shift+Enter for a new line)"></textarea><button type="button" id="mic" title="Voice chat: say &quot;Hey TINA&quot;. Click again to turn the mic off.">MIC</button><button>SEND</button></form>
  </footer>
</body>
</html>
